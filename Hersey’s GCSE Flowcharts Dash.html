<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Hersey’s GCSE Flowcharts Dash</title>
<style>
:root{--bg:#fff7ed;--card:#fff;--ink:#231942;--muted:#6b6485;--accent:#7c3aed;--accent2:#ec4899;--accent-ink:#fff;--good:#15803d;--goodbg:#dcfce7;--bad:#b91c1c;--badbg:#fee2e2;--line:#eadff5;--code:#1e1e2e;--code-ink:#cdd6f4;--s1:95%;--l1:92%;--l2:60%;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#150f28;--card:#211a3a;--ink:#f3eeff;--muted:#b3a9d1;--accent:#a78bfa;--accent2:#f472b6;--accent-ink:#150f28;--good:#86efac;--goodbg:#14301f;--bad:#fca5a5;--badbg:#3a1717;--line:#352b58;--code:#0b0814;--s1:45%;--l1:24%;--l2:62%;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#150f28;--card:#211a3a;--ink:#f3eeff;--muted:#b3a9d1;--accent:#a78bfa;--accent2:#f472b6;--accent-ink:#150f28;--good:#86efac;--goodbg:#14301f;--bad:#fca5a5;--badbg:#3a1717;--line:#352b58;--code:#0b0814;--s1:45%;--l1:24%;--l2:62%;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:10}
main{max-width:560px;margin:0 auto;padding:16px 16px 40px}
h1{font-size:1.75rem;line-height:1.15;margin:0 0 4px;background:linear-gradient(90deg,#7c3aed,#ec4899,#f59e0b,#10b981);background-size:200% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:sh 5s ease-in-out infinite alternate}
@keyframes sh{to{background-position:100% 0}}
.sub{color:var(--muted);margin:0 0 14px}
.card{background:var(--card);border:2px solid var(--line);border-radius:18px;padding:16px;margin-bottom:14px}
.card h2{font-size:1rem;margin:0 0 8px}
code{font-family:ui-monospace,Menlo,Consolas,monospace}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
button{font:inherit;cursor:pointer;border-radius:14px;border:2px solid var(--line);background:var(--card);color:var(--ink);padding:12px;text-align:left}
button small{display:block;color:var(--muted);font-size:.8rem}
button:active{transform:scale(.97)}
button:disabled{opacity:.6}
.mode{background:hsl(var(--h) var(--s1) var(--l1));border-color:hsl(var(--h) 70% var(--l2))}
.mode b{font-size:1.02rem}
.mode .best{color:var(--ink);font-weight:600;margin-top:2px}
.pri{background:linear-gradient(90deg,var(--accent),var(--accent2));color:#fff;border:0;font-weight:700;text-align:center}
.ghost{text-align:center;color:var(--muted)}
.dif{flex:1;text-align:center;font-weight:700}
.dif.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.opts.c1{grid-template-columns:1fr}
.opt{text-align:center;font-weight:700;padding:14px 8px;background:hsl(265 var(--s1) var(--l1));border-color:hsl(265 70% var(--l2))}
.opt:nth-child(2){background:hsl(330 var(--s1) var(--l1));border-color:hsl(330 70% var(--l2))}
.opt:nth-child(3){background:hsl(190 var(--s1) var(--l1));border-color:hsl(190 70% var(--l2))}
.opt:nth-child(4){background:hsl(40 var(--s1) var(--l1));border-color:hsl(40 70% var(--l2))}
.opts.code .opt{text-align:left;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:.82rem;font-weight:500;white-space:pre-wrap}
.row{display:flex;gap:10px}
.bar{display:flex;justify-content:space-between;font-size:.9rem;color:var(--muted);margin-bottom:8px}
.prog,.tm{height:8px;background:var(--line);border-radius:99px;overflow:hidden;margin-bottom:12px}
.prog i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--accent2));transition:width .3s}
.tm{height:12px}
.tm i{display:block;height:100%;width:100%;background:hsl(120 80% 48%)}
.q{font-size:1.1rem;font-weight:600;margin:0 0 12px}
.lab{font-size:.8rem;color:var(--muted);margin:8px 0 2px}
.tab{flex:1;text-align:center;padding:6px;margin-bottom:8px;font-size:.9rem}
.tab.on{background:var(--accent2);color:#fff;border-color:var(--accent2)}
input{flex:1;min-width:0;font:inherit;font-size:1.3rem;padding:10px 12px;border-radius:12px;border:2px solid var(--line);background:var(--bg);color:var(--ink)}
input:focus{outline:none;border-color:var(--accent)}
.fcv{margin:0 0 12px}
.fcs{width:100%;max-width:350px;display:block;margin:0 auto}
.fcs marker path{fill:var(--muted)}
.ed{fill:none;stroke:var(--muted);stroke-width:2}
.el{font:600 11px system-ui,sans-serif;fill:var(--muted)}
.nt{font:12px system-ui,sans-serif;fill:var(--ink);text-anchor:middle;pointer-events:none}
.nd{stroke-width:2}
.nd.start{fill:hsl(150 var(--s1) var(--l1));stroke:hsl(150 70% var(--l2))}
.nd.proc{fill:hsl(265 var(--s1) var(--l1));stroke:hsl(265 70% var(--l2))}
.nd.io{fill:hsl(330 var(--s1) var(--l1));stroke:hsl(330 70% var(--l2))}
.nd.dec{fill:hsl(40 var(--s1) var(--l1));stroke:hsl(40 70% var(--l2))}
.nd.vis{stroke:var(--accent2);stroke-width:4}
.nd.slot{fill:var(--bg);stroke:var(--muted);stroke-dasharray:5 4}
.nd.slot.hot{stroke:var(--accent2);stroke-width:3}
g[data-s]{cursor:pointer}
.bank{display:flex;flex-wrap:wrap;gap:2px;padding:6px;border:2px dashed var(--line);border-radius:12px;min-height:56px;margin-bottom:12px}
.chip{display:inline-block;margin:3px;padding:8px 10px;border-radius:12px;border:2px solid;font-size:.85rem;font-family:ui-monospace,Menlo,Consolas,monospace;cursor:grab;touch-action:none;user-select:none;-webkit-user-select:none;color:var(--ink)}
.chip.t-proc{background:hsl(265 var(--s1) var(--l1));border-color:hsl(265 70% var(--l2))}
.chip.t-io{background:hsl(330 var(--s1) var(--l1));border-color:hsl(330 70% var(--l2))}
.chip.t-dec{background:hsl(40 var(--s1) var(--l1));border-color:hsl(40 70% var(--l2))}
.chip.t-proc::before{content:"▭ "}.chip.t-io::before{content:"▱ "}.chip.t-dec::before{content:"◇ "}
.chip.sel{outline:3px solid var(--accent2)}
.chip.gh{position:fixed;transform:translate(-50%,-50%);pointer-events:none;z-index:30;opacity:.92}
.fb{border-radius:12px;padding:12px;margin-top:12px}
.fb.ok{background:var(--goodbg);color:var(--good)}
.fb.no{background:var(--badbg);color:var(--bad)}
.fb .wy{margin:4px 0 0;color:var(--ink);font-size:.94rem}
.fb .fcv{margin:8px 0 0;background:var(--card);border-radius:10px;padding:6px}
.hint{margin-top:10px;font-size:.92rem;color:var(--muted)}
.stat{display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid var(--line)}
.score{font-size:3.2rem;font-weight:800;text-align:center;margin:0;color:var(--accent2)}
.pop{animation:pop .4s}@keyframes pop{50%{transform:scale(1.05)}}
.shake{animation:shk .4s}@keyframes shk{25%{transform:translateX(-7px)}75%{transform:translateX(7px)}}
.cf{position:fixed;top:-40px;z-index:20;pointer-events:none;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(115vh) rotate(360deg)}}
</style>
</head>
<body>
<main id="app"></main>
<script>
const $=s=>document.querySelector(s),ri=(a,b)=>Math.floor(Math.random()*(b-a+1))+a,pick=a=>a[ri(0,a.length-1)],TOTAL=10;
const store={g(k){try{return+localStorage.getItem(k)||0}catch(e){return 0}},s(k,v){try{localStorage.setItem(k,v)}catch(e){}}};
let S={},D=store.g("hfc-d"),T=null,M=0,SC=0;
const py=s=>s.replace(/\bDIV\b/g,"//").replace(/\bMOD\b/g,"%");
const esc=s=>String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
const toPy=c=>c.split("\n").map(l=>{let m;
 if(/^\s*END/.test(l))return null;
 if(m=l.match(/^(\s*)INPUT (\w+)/))return m[1]+m[2]+" = int(input())";
 if(m=l.match(/^(\s*)WHILE (.*)/))return m[1]+"while "+py(m[2])+":";
 if(m=l.match(/^(\s*)IF (.*) THEN/))return m[1]+"if "+py(m[2])+":";
 if(/^\s*ELSE\s*$/.test(l))return l.match(/^\s*/)[0]+"else:";
 if(m=l.match(/^(\s*)OUTPUT (.*)/))return m[1]+"print("+py(m[2])+")";
 return py(l.replace("←","="))}).filter(x=>x!==null).join("\n");
const dp=(t,tx,m)=>m?tx:t==="proc"?py(tx.replace("←","=")):t==="io"?(/^INPUT /.test(tx)?tx.slice(6)+" = int(input())":"print("+py(tx.slice(7))+")"):t==="dec"?py(tx):tx;
function confetti(n){const e=["🎉","✨","🌟","🎈","🧡","💜"];for(let i=0;i<n;i++){const s=document.createElement("span");s.className="cf";s.textContent=pick(e);s.style.left=ri(0,95)+"%";s.style.fontSize=ri(18,34)+"px";s.style.animationDuration=ri(20,40)/10+"s";document.body.appendChild(s);setTimeout(()=>s.remove(),4500)}}

/* ---------- expression evaluator (no eval) ---------- */
function ev(s,V){const t=s.match(/>=|<=|<>|\w+|[-+*()<>=]/g);let p=0;
 const cmp=()=>{let a=add();while(["=","<>","<",">","<=",">="].includes(t[p])){const o=t[p++],b=add();a=o==="="?a===b:o==="<>"?a!==b:o==="<"?a<b:o===">"?a>b:o==="<="?a<=b:a>=b}return a},
 add=()=>{let a=mul();while(t[p]==="+"||t[p]==="-"){const o=t[p++],b=mul();a=o==="+"?a+b:a-b}return a},
 mul=()=>{let a=at();while(["*","MOD","DIV"].includes(t[p])){const o=t[p++],b=at();a=o==="*"?a*b:o==="MOD"?a%b:Math.floor(a/b)}return a},
 at=()=>{const k=t[p++];if(k==="("){const v=cmp();p++;return v}return/^\d+$/.test(k)?+k:V[k]};
 return cmp()}

/* ---------- flowchart model ---------- */
function mkfc(sp){const N=[],add=(t,tx,c,r)=>{const n={id:N.length,t,tx,c,r};N.push(n);return n},
 ch=(it,c,r)=>{let p=null,f=null;it.forEach(([t,tx],i)=>{const n=add(t,tx,c,r+i);if(p)p.nx=n.id;else f=n;p=n});return[f,p,r+it.length]};
 const s=add("start","Start",0,0),[hf,hz,r]=ch(sp.head||[],0,1);let last=s;if(hf){s.nx=hf.id;last=hz}
 if(sp.k==="A"){last.nx=add("end","End",0,r).id}
 else{const d=add("dec",sp.cond,0,r);last.nx=d.id;
  if(sp.k==="B"){const[yf,yz]=ch(sp.yes,0,r+1),[nf,nz]=ch(sp.no,1,r+1),e=add("end","End",0,r+1+Math.max(sp.yes.length,sp.no.length));d.yes=yf.id;d.no=nf.id;yz.nx=e.id;nz.nx=e.id}
  else{const[bf,bz]=ch(sp.body,0,r+1),[xf,xz,xr]=ch(sp.exit,1,r+1),e=add("end","End",1,xr);d.yes=bf.id;bz.nx=d.id;d.no=xf?xf.id:e.id;if(xz)xz.nx=e.id}}
 return{N,sp}}
function go(fc,inp){const V={},out=[],path=[],cnt={};let n=fc.N[0],st=0,ip=0;
 while(n&&st++<300){path.push(n.id);cnt[n.id]=(cnt[n.id]||0)+1;let m;
  if(n.t==="end")break;
  if(n.t==="proc"){m=n.tx.match(/^(\w+) ← (.*)/);V[m[1]]=ev(m[2],V);n=fc.N[n.nx]}
  else if(n.t==="io"){if(/^INPUT /.test(n.tx))V[n.tx.slice(6)]=inp[ip++];else out.push(ev(n.tx.slice(7),V));n=fc.N[n.nx]}
  else if(n.t==="dec")n=fc.N[ev(n.tx,V)?n.yes:n.no];
  else n=fc.N[n.nx]}
 return{V,out,path,cnt}}
function ser(sp){const L=a=>a.map(x=>x[1]),I=a=>L(a).map(x=>"  "+x),h=L(sp.head||[]);
 return(sp.k==="A"?h:sp.k==="B"?[...h,"IF "+sp.cond+" THEN",...I(sp.yes),"ELSE",...I(sp.no),"ENDIF"]:[...h,"WHILE "+sp.cond,...I(sp.body),"ENDWHILE",...L(sp.exit)]).join("\n")}
const mt=s=>{const o=[[/ > /," < "],[/ < /," > "],[/ <= /," >= "],[/ \+ /," - "],[/ - /," + "],[/ \* /," + "]],m=s.replace(/\d+/,d=>+d+pick([1,2,3]));if(m!==s&&Math.random()<.7)return m;for(const[a,b]of o)if(a.test(s))return s.replace(a,b);return m};
function mut(sp){const c=JSON.parse(JSON.stringify(sp)),L=["head","yes","no","body","exit"].filter(k=>c[k]&&c[k].length).flatMap(k=>c[k]),t=pick(L.concat(c.cond?[null]:[]));if(t===null)c.cond=mt(c.cond);else t[1]=mt(t[1]);return c}

/* ---------- drawing ---------- */
const CW=[135,280],RY=r=>32+r*72,HW={start:55,end:55,proc:60,io:66,dec:75},HH={start:17,end:17,proc:19,io:19,dec:29};
function shp(t,X,Y,cl,tx,att){let s;
 if(t==="start"||t==="end")s=`<rect x="${X-55}" y="${Y-17}" width="110" height="34" rx="17"`;
 else if(t==="proc")s=`<rect x="${X-60}" y="${Y-19}" width="120" height="38" rx="3"`;
 else if(t==="io")s=`<polygon points="${X-48},${Y-19} ${X+66},${Y-19} ${X+48},${Y+19} ${X-66},${Y+19}"`;
 else s=`<polygon points="${X},${Y-29} ${X+75},${Y} ${X},${Y+29} ${X-75},${Y}"`;
 return`<g ${att||""}>${s} class="nd ${t==="end"?"start":t} ${cl||""}"/><text class="nt" x="${X}" y="${Y+4}">${esc(tx)}</text></g>`}
const an=n=>{const X=CW[n.c],Y=RY(n.r);return{X,Y,t:Y-HH[n.t],b:Y+HH[n.t],l:X-HW[n.t],r:X+HW[n.t]}};
function svg(fc,m,hl,B){const id="a"+(++SC),N=fc.N,H=RY(Math.max(...N.map(n=>n.r)))+40;let e="",s="";
 N.forEach(n=>{(n.t==="dec"?[[n.yes,"y"],[n.no,"n"]]:n.nx!=null?[[n.nx,""]]:[]).forEach(([to,k])=>{const a=an(n),T2=N[to],b=an(T2);let d;
  if(T2.r>n.r){d=T2.c===n.c?`M${a.X} ${a.b}V${b.t}`:T2.c>n.c?`M${a.r} ${a.Y}H${b.X}V${b.t}`:`M${a.X} ${a.b}V${b.t-16}H${b.X}V${b.t}`}
  else d=`M${a.l} ${a.Y}H16V${b.Y}H${b.l}`;
  e+=`<path class="ed" d="${d}" marker-end="url(#${id})"/>`;
  if(k==="y")e+=`<text class="el" x="${a.X+8}" y="${a.b+14}">Yes</text>`;
  if(k==="n")e+=`<text class="el" x="${a.r+6}" y="${a.Y-6}">No</text>`})});
 N.forEach(n=>{const X=CW[n.c],Y=RY(n.r);
  if(B&&B.slots.includes(n.id)){const bi=B.put[n.id];s+=bi!==undefined?shp(n.t,X,Y,"",dp(n.t,B.bl[bi].tx,m),`data-s="${n.id}" data-b="${bi}"`):shp(n.t,X,Y,"slot"+(B.sel!=null?" hot":""),"?",`data-s="${n.id}"`)}
  else s+=shp(n.t,X,Y,hl&&hl.has(n.id)?"vis":"",dp(n.t,n.tx,m))});
 return`<div class="fcv"><svg class="fcs" viewBox="0 0 350 ${H}"><defs><marker id="${id}" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z"/></marker></defs>${e}${s}</svg></div>`}

/* ---------- flowchart templates ---------- */
const R=ri;
const TP={
 t1e:()=>{const a=R(2,5);return{sp:{k:"A",head:[["io","INPUT n"],["proc","x ← n * "+a],["io","OUTPUT x"]]},inp:[R(2,9)],d:"Input a number, multiply it by "+a+", and output the result."}},
 t1h:()=>{const a=R(2,5),b=R(2,9);return{sp:{k:"A",head:[["io","INPUT n"],["proc","x ← n * "+a],["proc","x ← x + "+b],["io","OUTPUT x"]]},inp:[R(3,9)],d:"Input a number, multiply it by "+a+", add "+b+", then output the result."}},
 t2e:()=>{const x=R(8,15);return{sp:{k:"B",head:[["io","INPUT n"]],cond:"n > "+x,yes:[["io","OUTPUT n * 2"]],no:[["io","OUTPUT n + 5"]]},inp:[pick([x-R(2,5),x+R(2,6)])],d:"Input a number. If it is greater than "+x+", output double the number. Otherwise output the number plus 5."}},
 t2h:()=>{const x=R(10,16);return{sp:{k:"B",head:[["io","INPUT n"],["proc","n ← n + 3"]],cond:"n > "+x,yes:[["proc","n ← n * 2"],["io","OUTPUT n"]],no:[["proc","n ← n - 2"],["io","OUTPUT n"]]},inp:[R(4,20)],d:"Input a number and add 3. If the result is greater than "+x+", double it. Otherwise subtract 2. Output the final number."}},
 t3s:()=>{const N=R(3,D?7:5);return{sp:{k:"C",head:[["proc","i ← 1"],["proc","total ← 0"]],cond:"i <= "+N,body:[["proc","total ← total + i"],["proc","i ← i + 1"]],exit:[["io","OUTPUT total"]]},inp:[],d:"Add up the whole numbers from 1 to "+N+", then output the total."}},
 t3o:()=>{const N=R(3,5),a=R(2,4);return{sp:{k:"C",head:[["proc","i ← 1"]],cond:"i <= "+N,body:[["io","OUTPUT i * "+a],["proc","i ← i + 1"]],exit:[]},inp:[],d:"Output the numbers 1 to "+N+", each multiplied by "+a+"."}},
 t3c:()=>{const s=R(2,4),L=R(10,20);return{sp:{k:"C",head:[["proc","n ← 0"],["proc","count ← 0"]],cond:"n < "+L,body:[["proc","n ← n + "+s],["proc","count ← count + 1"]],exit:[["io","OUTPUT count"]]},inp:[],d:"Count how many times "+s+" can be added to 0 before the total reaches "+L+", then output the count."}},
 t4d:()=>{const L=R(40,100);return{sp:{k:"C",head:[["io","INPUT n"]],cond:"n < "+L,body:[["proc","n ← n * 2"]],exit:[["io","OUTPUT n"]]},inp:[R(2,9)],d:"Input a number. Keep doubling it while it is less than "+L+", then output it."}},
 t4c:()=>{const L=R(30,60);return{sp:{k:"C",head:[["io","INPUT n"],["proc","count ← 0"]],cond:"n < "+L,body:[["proc","n ← n * 2"],["proc","count ← count + 1"]],exit:[["io","OUTPUT n"],["io","OUTPUT count"]]},inp:[R(2,6)],d:"Input a number. Keep doubling it and counting the doublings while it is less than "+L+". Output the number, then the count."}}};
const EASY=["t1e","t2e","t3s","t3o","t4d"],HARD=["t1h","t2h","t3s","t3c","t4c","t4d","t3o"];
const mkq=k=>{const t=TP[k](),fc=mkfc(t.sp);return{...t,fc,r:go(fc,t.inp)}};
const intro=w=>w.inp.length?"The user enters "+w.inp.join(", ")+". ":"";

/* ---------- questions ---------- */
function read(){const w=mkq(pick(D?HARD:EASY)),o=w.r.out;let ans,txt;
 if(o.length===1){ans=o[0];txt="What does the flowchart output?"}
 else{const v=pick([["What is the last number output?",o[o.length-1]],["What is the total of all the numbers output?",o.reduce((a,b)=>a+b,0)],["How many numbers are output?",o.length]]);txt=v[0];ans=v[1]}
 return{kind:"code",op:"Read",text:intro(w)+txt,fc:w.fc,ans,hint:"Start at Start and follow the arrows. Write down the value of each variable as you go.",why:()=>"The flowchart outputs "+o.join(", ")+". The highlighted boxes show the route taken."+svg(w.fc,M,new Set(w.r.path))}}
function path(){const w=mkq(pick(D?["t3s","t3c","t4c","t4d","t2h","t3o"]:["t3s","t3o","t4d","t2e","t1e"])),r=w.r,d=w.fc.N.find(n=>n.t==="dec"),v=[],ks=Object.keys(r.V),k=pick(ks);
 if(d)v.push(["How many times is the decision box tested?",r.cnt[d.id]]);
 if(d&&w.sp.k==="C")v.push(["How many times does the loop body run?",r.cnt[d.yes]||0]);
 v.push(["What is the value of <code>"+k+"</code> when the flowchart reaches End?",r.V[k]],["How many boxes are visited in total, counting Start, End and every repeat?",r.path.length]);
 const s=pick(v);return{kind:"code",op:"Path",text:intro(w)+s[0],fc:w.fc,ans:s[1],hint:"Follow the arrows and tick off each box every time you pass through it. A loop’s decision is tested one more time than its body runs.",why:()=>"Following the arrows gives "+s[1]+". The highlighted boxes show the route taken."+svg(w.fc,M,new Set(r.path))}}
function symbols(){const O=["Start / End","Process","Input / Output","Decision"],t=ri(1,3);
 if(t===1){const k=pick(["start","proc","io","dec"]),a={start:0,proc:1,io:2,dec:3}[k];return{kind:"real",op:"Symbols",text:"What does this flowchart symbol mean?",shape:k,opts:O,ans:a,hint:"Rounded = start/end, rectangle = process, parallelogram = input/output, diamond = decision.",why:"This shape means "+O[a]+"."}}
 if(t===2){const s=pick([["A box contains <code>x ← x + 1</code>. Which symbol should it use?",1],["A box contains <code>INPUT n</code>. Which symbol should it use?",2],["A box asks <code>n > 5</code> and has Yes and No arrows. Which symbol is it?",3],["This is the very first box in the flowchart. Which symbol is it?",0],["A box contains <code>OUTPUT total</code>. Which symbol should it use?",2],["A box contains <code>count ← 0</code>. Which symbol should it use?",1]]);return{kind:"real",op:"Symbols",text:s[0],opts:O,ans:s[1],hint:"Rounded = start/end, rectangle = process, parallelogram = input/output, diamond = decision.",why:"The correct symbol is "+O[s[1]]+"."}}
 const c=pick([["What do the arrows in a flowchart show?","the order the steps happen in","the value of each variable"],["How many exits does a decision box have?","two (Yes and No)","only one"],["A flowchart is…","a diagram showing the steps of an algorithm","a list of variable names"]]),f=Math.random()<.5;
 return{kind:"real",op:"Symbols",text:c[0],opts:f?[c[2],c[1]]:[c[1],c[2]],ans:f?1:0,hint:"Think about what a flowchart is used for.",why:"The correct answer: "+c[1]+"."}}
function match(){const w=mkq(pick(D?HARD:EASY)),a=ser(w.sp);let b,n=0;do{b=ser(mut(w.sp))}while(b===a&&n++<30);
 const f=Math.random()<.5,A=[a,toPy(a)],B=[b,toPy(b)],o=f?[B,A]:[A,B];
 return{kind:"code",op:"Match",text:"Which code matches this flowchart?",fc:w.fc,o:[o.map(x=>x[1]),o.map(x=>x[0])],opts:["A","B"],cls:" c1 code",ans:f?1:0,hint:"Check each decision, calculation and output against the boxes, one at a time.",why:()=>"The matching code is option "+(f?"B":"A")+"."+svg(w.fc,M)}}
function build(){const w=mkq(pick(D?["t2h","t3s","t4d","t4c"]:["t1e","t2e"])),sl=w.fc.N.filter(n=>n.t!=="start"&&n.t!=="end"),bl=sl.map(n=>({tx:n.tx,t:n.t}));
 for(let i=0,k=0;i<(D?2:1)&&k<30;k++){const s=pick(sl),tx=mt(s.tx);if(tx!==s.tx&&!bl.some(b=>b.tx===tx)){bl.push({tx,t:s.t});i++}}
 bl.sort(()=>Math.random()-.5);
 return{kind:"build",op:"Build",text:"Build the flowchart for this: "+w.d+" Drag each block into place, or tap a block then tap a slot.",fc:w.fc,build:{bl,slots:sl.map(n=>n.id)},ans:1,hint:"Start with the first step after Start. A block with Yes and No exits is a decision. One extra block doesn’t belong.",why:()=>"This is the correct flowchart."+svg(w.fc,M)}}
const MODES={
 read:{n:"Read it 👀",d:"Work out the output",h:265,g:read},
 path:{n:"Follow the path 🧭",d:"Loops, tests and values",h:35,g:path},
 sym:{n:"Symbols 🔷",d:"Know your shapes",h:330,g:symbols},
 match:{n:"Match the code 💻",d:"Flowchart to Python",h:150,g:match},
 build:{n:"Build it 🧩",d:"Drag and drop blocks",h:190,g:build},
 boss:{n:"Challenge 🏆",d:"Everything mixed",h:15,g:()=>pick([read,path,symbols,match,build])()}};
const TOP={Read:"Reading flowcharts",Path:"Following the path",Symbols:"Flowchart symbols",Match:"Flowcharts and code",Build:"Building flowcharts"};

/* ---------- drag and drop ---------- */
function bdraw(){const B=S.b,u=new Set(Object.values(B.put));
 $("#bld").innerHTML=svg(S.q.fc,M,null,B)+'<div class="lab">Blocks (drag or tap)</div><div class="bank">'+B.bl.map((b,i)=>u.has(i)?"":`<div class="chip t-${b.t}${B.sel===i?" sel":""}" data-b="${i}">${esc(dp(b.t,b.tx,M))}</div>`).join("")+"</div>"}
function bput(bi,sid){const B=S.b;for(const k in B.put)if(B.put[k]===bi)delete B.put[k];if(sid!=null)B.put[sid]=bi;B.sel=null;bdraw()}
function bind(){const el=$("#bld");let st=null,gh=null;
 el.onpointerdown=e=>{if(S.done)return;const t=e.target.closest("[data-b],[data-s]");if(!t)return;st={x:e.clientX,y:e.clientY,b:t.dataset.b!==undefined?+t.dataset.b:null,s:t.dataset.s!==undefined?+t.dataset.s:null,mv:false};if(st.b!==null)e.preventDefault()};
 window.onpointermove=e=>{if(!st||st.b===null)return;if(!st.mv&&Math.hypot(e.clientX-st.x,e.clientY-st.y)>8){st.mv=true;const b=S.b.bl[st.b];gh=document.createElement("div");gh.className="chip gh t-"+b.t;gh.textContent=dp(b.t,b.tx,M);document.body.appendChild(gh)}if(gh){gh.style.left=e.clientX+"px";gh.style.top=e.clientY+"px"}};
 window.onpointerup=e=>{if(!st)return;const s=st;st=null;if(gh){gh.remove();gh=null}if(S.done)return;
  if(s.mv){const d=document.elementFromPoint(e.clientX,e.clientY),t=d&&d.closest("[data-s]");bput(s.b,t?+t.dataset.s:null)}
  else if(s.b!==null&&s.s===null){S.b.sel=S.b.sel===s.b?null:s.b;bdraw()}
  else if(s.s!==null&&s.b!==null)bput(s.b,null);
  else if(s.s!==null&&S.b.sel!==null)bput(S.b.sel,s.s)}}

/* ---------- screens ---------- */
function menu(){clearInterval(T);S={};
 $("#app").innerHTML=`<h1>🔀 Hersey’s GCSE Flowcharts Dash</h1>
 <p class="sub">GCSE Computer Science · Flowcharts · 10 questions · beat the clock!</p>
 <div class="row" style="margin-bottom:14px"><button class="dif ${D?"":"on"}" data-d="0">🌱 Easy</button><button class="dif ${D?"on":""}" data-d="1">🔥 Hard</button></div>
 <div class="card"><h2>Quick reminder</h2>
 <div class="fcv"><svg class="fcs" viewBox="0 0 350 150">${shp("start",90,32,"","Start / End")}${shp("proc",265,32,"","Process")}${shp("io",90,108,"","Input / Output")}${shp("dec",265,108,"","Decision")}</svg></div>
 <p class="hint" style="margin:0">Arrows show the order. A decision has two exits, <b>Yes</b> and <b>No</b>. Boxes can show Python or exam reference language: use the tabs.</p></div>
 <div class="grid">${Object.keys(MODES).map(k=>{const m=MODES[k],b=store.g("hfc-"+D+"-"+k);return`<button class="mode" style="--h:${m.h}" data-m="${k}"><b>${m.n}</b><small>${m.d}</small><div class="best">${b?"🏅 Best: "+b:"No score yet"}</div></button>`}).join("")}</div>`;
 document.querySelectorAll(".mode").forEach(b=>b.onclick=()=>start(b.dataset.m));
 document.querySelectorAll(".dif").forEach(b=>b.onclick=()=>{D=+b.dataset.d;store.s("hfc-d",D);menu()})}
function start(m){S={m,i:0,score:0,streak:0,best:0,right:0,st:{Read:[0,0],Path:[0,0],Symbols:[0,0],Match:[0,0],Build:[0,0]}};next()}
const ot=(q,i)=>q.o?"Option "+"AB"[i]+"\n"+q.o[M][i]:q.opts[i];
function draw(){const q=S.q;if(q.build)bdraw();else if(q.fc)$("#fc").innerHTML=svg(q.fc,M);if(q.o)document.querySelectorAll(".opt").forEach((b,i)=>b.textContent=ot(q,i))}
function next(){clearInterval(T);if(S.i>=TOTAL)return end();
 const q=S.q=MODES[S.m].g();S.done=false;S.hint=false;S.i++;
 q.t={real:[40,30],code:[90,70],build:[160,110]}[q.kind][D];
 const tabs=`<div class="row"><button class="tab ${M?"":"on"}" data-m="0">🐍 Python</button><button class="tab ${M?"on":""}" data-m="1">Exam reference language</button></div>`;
 const inp=q.build?`<div class="row"><button class="pri" id="chk" style="flex:2">Check my flowchart</button><button class="ghost" id="rs" style="flex:1">Reset</button></div>`:q.opts?`<div class="opts${q.cls||""}">${q.opts.map((o,i)=>`<button class="opt" data-i="${i}">${esc(ot(q,i))}</button>`).join("")}</div>`:`<div class="row"><input id="ans" type="number" inputmode="numeric" placeholder="Your answer" autocomplete="off"><button class="pri" id="chk">Check</button></div>`;
 $("#app").innerHTML=`<div class="bar"><span>Question ${S.i}/${TOTAL} · ${D?"Hard 🔥":"Easy 🌱"}</span><span>⭐ ${S.score} &nbsp; 🔥 ${S.streak}</span></div>
 <div class="prog"><i style="width:${(S.i-1)/TOTAL*100}%"></i></div>
 <div class="card"><div class="tm"><i id="tb"></i></div><div class="bar" style="margin:-6px 0 6px"><span></span><span id="tn">${q.t}s</span></div>
 <p class="q">${q.text}</p>
 ${q.shape?`<div class="fcv"><svg class="fcs" style="max-width:200px" viewBox="0 0 200 64">${shp(q.shape,100,32,"","")}</svg></div>`:""}
 ${q.fc?tabs:""}
 ${q.build?'<div id="bld"></div>':q.fc?`<div id="fc">${svg(q.fc,M)}</div>`:""}
 ${inp}
 <div id="fb"></div>
 <div class="row" style="margin-top:10px"><button class="ghost" id="hb" style="flex:1">💡 Hint (half points)</button><button class="ghost" id="qb">Quit</button></div><div id="hint"></div></div>`;
 document.querySelectorAll(".tab").forEach(b=>b.onclick=()=>{M=+b.dataset.m;document.querySelectorAll(".tab").forEach(x=>x.classList.toggle("on",x===b));draw()});
 if(q.build){S.b={bl:q.build.bl,slots:q.build.slots,put:{},sel:null};bdraw();bind();
  $("#chk").onclick=()=>{const B=S.b;finish(B.slots.every(id=>B.put[id]!==undefined&&B.bl[B.put[id]].tx===q.fc.N[id].tx))};
  $("#rs").onclick=()=>{if(!S.done){S.b.put={};S.b.sel=null;bdraw()}}}
 else if(q.opts)document.querySelectorAll(".opt").forEach(b=>b.onclick=()=>finish(+b.dataset.i===q.ans));
 else{$("#chk").onclick=()=>{const v=$("#ans").value.trim();if(v!=="")finish(Number(v)===q.ans)};$("#ans").onkeydown=e=>{if(e.key==="Enter")$("#chk").click()};$("#ans").focus()}
 $("#hb").onclick=()=>{S.hint=true;$("#hint").innerHTML='<div class="hint">💡 '+q.hint+'</div>'};
 $("#qb").onclick=menu;
 S.t0=Date.now();S.rem=q.t;
 T=setInterval(()=>{const e=Math.max(0,q.t-(Date.now()-S.t0)/1000),f=e/q.t;S.rem=e;$("#tb").style.width=f*100+"%";$("#tb").style.background="hsl("+Math.round(f*120)+" 80% 48%)";$("#tn").textContent=Math.ceil(e)+"s";if(e<=0)finish(false,true)},100)}
function finish(ok,to){if(S.done)return;S.done=true;clearInterval(T);
 const q=S.q,t=S.st[q.op],W=typeof q.why==="function"?q.why():q.why,A=q.build?null:q.opts?q.opts[q.ans]:q.ans;t[1]++;let m;
 if(ok){t[0]++;S.right++;S.streak++;S.best=Math.max(S.best,S.streak);
  const base=(D?20:10)/(S.hint?2:1),sb=S.hint?0:Math.min(S.streak-1,5),tb=S.hint?0:Math.round(5*S.rem/q.t),pts=base+sb+tb;S.score+=pts;
  m='<div class="fb ok pop"><b>✅ Correct! +'+pts+'</b><br><small>'+base+' base'+(sb?' + '+sb+' streak':'')+(tb?' + '+tb+' speed':'')+'</small><div class="wy">'+W+'</div></div>';
  if(S.streak%5===0)confetti(14)}
 else{S.streak=0;m='<div class="fb no shake"><b>'+(to?"⏰ Time’s up! ":"❌ Not quite. ")+(A===null?"Here is the correct flowchart.":"The answer is "+A+".")+'</b><div class="wy">'+W+'</div></div>'}
 $("#fb").innerHTML=m+'<button class="pri" id="nx" style="width:100%;margin-top:12px">'+(S.i>=TOTAL?"See results":"Next question")+'</button>';
 if($("#ans"))$("#ans").disabled=true;
 if($("#chk"))$("#chk").disabled=true;
 if($("#rs"))$("#rs").disabled=true;
 document.querySelectorAll(".opt").forEach(b=>{b.disabled=true;if(+b.dataset.i===q.ans)b.style.outline="3px solid var(--good)"});
 $("#hb").disabled=true;$("#nx").onclick=next;$("#nx").focus()}
function end(){const pct=S.right*10,key="hfc-"+D+"-"+S.m,old=store.g(key),nh=S.score>old;if(nh)store.s(key,S.score);
 if(nh||pct===100)confetti(40);
 const msg=pct===100?"Perfect! Exam ready. 🏆":pct>=80?"Great work, nearly there! 🎉":pct>=50?"Good progress. Keep practising! 💪":"Keep going. Use the hints and read the working! 🌱";
 const rows=Object.entries(S.st).filter(([k,v])=>v[1]>0).map(([k,v])=>`<div class="stat"><span>${TOP[k]}</span><b>${v[0]}/${v[1]}</b></div>`).join("");
 $("#app").innerHTML=`<h1>Round complete!</h1><p class="sub">${MODES[S.m].n} · ${D?"Hard 🔥":"Easy 🌱"}</p>
 <div class="card"><p class="score">${S.score}</p><p style="text-align:center;margin:0 0 6px">points</p>
 <p style="text-align:center;font-weight:700;margin:0 0 12px">${nh?"🏆 New high score!":"🏅 High score: "+old}</p>
 <div class="stat"><span>Correct</span><b>${S.right}/${TOTAL} (${pct}%)</b></div><div class="stat"><span>Best streak</span><b>🔥 ${S.best}</b></div>${rows}
 <p style="margin-bottom:0">${msg}</p></div>
 <div class="row"><button class="pri" id="again" style="flex:1">Play again</button><button id="mn" style="flex:1;text-align:center">Menu</button></div>`;
 $("#again").onclick=()=>start(S.m);$("#mn").onclick=menu}
menu();
</script>
