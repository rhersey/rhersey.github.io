<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Hersey’s GCSE Arrays &amp; Lists Dash</title>
<style>
:root{--bg:#fff7ed;--card:#fff;--ink:#231942;--muted:#6b6485;--accent:#7c3aed;--accent2:#ec4899;--accent-ink:#fff;--good:#15803d;--goodbg:#dcfce7;--bad:#b91c1c;--badbg:#fee2e2;--line:#eadff5;--code:#1e1e2e;--code-ink:#cdd6f4;--kw:#f9a8d4;--s1:95%;--l1:92%;--l2:60%;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#150f28;--card:#211a3a;--ink:#f3eeff;--muted:#b3a9d1;--accent:#a78bfa;--accent2:#f472b6;--accent-ink:#150f28;--good:#86efac;--goodbg:#14301f;--bad:#fca5a5;--badbg:#3a1717;--line:#352b58;--code:#0b0814;--s1:45%;--l1:24%;--l2:62%;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#150f28;--card:#211a3a;--ink:#f3eeff;--muted:#b3a9d1;--accent:#a78bfa;--accent2:#f472b6;--accent-ink:#150f28;--good:#86efac;--goodbg:#14301f;--bad:#fca5a5;--badbg:#3a1717;--line:#352b58;--code:#0b0814;--s1:45%;--l1:24%;--l2:62%;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:10}
main{max-width:560px;margin:0 auto;padding:16px 16px 40px}
h1{font-size:1.75rem;line-height:1.15;margin:0 0 4px;background:linear-gradient(90deg,#7c3aed,#ec4899,#f59e0b,#10b981);background-size:200% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:sh 5s ease-in-out infinite alternate}
@keyframes sh{to{background-position:100% 0}}
.sub{color:var(--muted);margin:0 0 14px}
.card{background:var(--card);border:2px solid var(--line);border-radius:18px;padding:16px;margin-bottom:14px}
.card h2{font-size:1rem;margin:0 0 8px}
table{width:100%;border-collapse:collapse;font-size:.85rem}
th,td{padding:6px;text-align:left;border-bottom:1px solid var(--line)}
th{color:var(--muted);font-weight:600}
code{font-family:ui-monospace,Menlo,Consolas,monospace}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
button{font:inherit;cursor:pointer;border-radius:14px;border:2px solid var(--line);background:var(--card);color:var(--ink);padding:12px;text-align:left}
button small{display:block;color:var(--muted);font-size:.8rem}
button:active{transform:scale(.97)}
button:disabled{opacity:.5}
.mode{background:hsl(var(--h) var(--s1) var(--l1));border-color:hsl(var(--h) 70% var(--l2))}
.mode b{font-size:1.02rem}
.mode .best{color:var(--ink);font-weight:600;margin-top:2px}
.pri{background:linear-gradient(90deg,var(--accent),var(--accent2));color:#fff;border:0;font-weight:700;text-align:center}
.ghost{text-align:center;color:var(--muted)}
.dif{flex:1;text-align:center;font-weight:700}
.dif.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.row{display:flex;gap:10px}
.bar{display:flex;justify-content:space-between;font-size:.9rem;color:var(--muted);margin-bottom:8px}
.prog,.tm{height:8px;background:var(--line);border-radius:99px;overflow:hidden;margin-bottom:12px}
.prog i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--accent2));transition:width .3s}
.tm{height:12px}
.tm i{display:block;height:100%;width:100%;background:hsl(120 80% 48%)}
.q{font-size:1.1rem;font-weight:600;margin:0 0 12px}
.big{font-size:1.9rem;text-align:center;padding:6px 0;font-weight:800;font-family:ui-monospace,Menlo,Consolas,monospace;color:var(--accent);overflow-x:auto;white-space:nowrap}
.py{text-align:center;color:var(--muted);margin-bottom:12px}
.arr{display:flex;gap:6px;overflow-x:auto;padding:6px 2px 12px;justify-content:center}
.cell{min-width:46px;text-align:center}
.cell b{display:block;padding:9px 6px;border-radius:10px;font-family:ui-monospace,Menlo,Consolas,monospace;background:hsl(var(--h) var(--s1) var(--l1));border:2px solid hsl(var(--h) 70% var(--l2))}
.cell i{display:block;font-style:normal;font-size:.75rem;color:var(--muted);margin-top:2px}
pre{background:var(--code);color:var(--code-ink);padding:12px;border-radius:12px;overflow-x:auto;margin:0 0 12px;font-size:.92rem}
pre[hidden]{display:none}
.tab{flex:1;text-align:center;padding:6px;margin-bottom:8px;font-size:.9rem}
.tab.on{background:var(--accent2);color:#fff;border-color:var(--accent2)}
input{flex:1;min-width:0;font:inherit;font-size:1.3rem;padding:10px 12px;border-radius:12px;border:2px solid var(--line);background:var(--bg);color:var(--ink)}
input:focus{outline:none;border-color:var(--accent)}
.fb{border-radius:12px;padding:12px;margin-top:12px}
.fb.ok{background:var(--goodbg);color:var(--good)}
.fb.no{background:var(--badbg);color:var(--bad)}
.fb p{margin:4px 0 0;color:var(--ink);font-size:.94rem}
.hint{margin-top:10px;font-size:.92rem;color:var(--muted)}
.stat{display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid var(--line)}
.score{font-size:3.2rem;font-weight:800;text-align:center;margin:0;color:var(--accent2)}
.pop{animation:pop .4s}@keyframes pop{50%{transform:scale(1.05)}}
.shake{animation:shk .4s}@keyframes shk{25%{transform:translateX(-7px)}75%{transform:translateX(7px)}}
.cf{position:fixed;top:-40px;z-index:20;pointer-events:none;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(115vh) rotate(360deg)}}
</style>
</head>
<body>
<main id="app"></main>
<script>
const $=s=>document.querySelector(s),ri=(a,b)=>Math.floor(Math.random()*(b-a+1))+a,pick=a=>a[ri(0,a.length-1)],fl=Math.floor,TOTAL=10;
const store={g(k){try{return+localStorage.getItem(k)||0}catch(e){return 0}},s(k,v){try{localStorage.setItem(k,v)}catch(e){}}};
let S={},D=store.g("har-d"),T=null;
const py=s=>s.replace(/\bDIV\b/g,"//").replace(/\bMOD\b/g,"%").replace(/\bLEN\(/g,"len(");
const esc=s=>s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
const uniq=(n,lo,hi)=>{const s=new Set;while(s.size<n)s.add(ri(lo,hi));return[...s]};
const NM=["scores","nums","prices","marks","ages","temps"];
const dec=(nm,a)=>nm+" ← ["+a.join(", ")+"]";
const toPy=c=>c.split("\n").map(l=>{let m;
 if(/^\s*END/.test(l))return null;
 if(m=l.match(/^(\s*)FOR (\w+) ← (\d+) TO (.+)/)){const L=m[4].match(/^LEN\((\w+)\) - 1$/);return m[1]+"for "+m[2]+" in range("+(L?(m[3]==="0"?"":m[3]+", ")+"len("+L[1]+")":m[3]+", "+py(m[4])+" + 1")+"):"}
 if(m=l.match(/^(\s*)IF (.*) THEN/))return m[1]+"if "+py(m[2]).replace(" = "," == ")+":";
 if(m=l.match(/^(\s*)OUTPUT (.*)/))return m[1]+"print("+py(m[2])+")";
 return py(l.replace("←","="))}).filter(x=>x!==null).join("\n");
function confetti(n){const e=["🎉","✨","🌟","🎈","🧡","💜"];for(let i=0;i<n;i++){const s=document.createElement("span");s.className="cf";s.textContent=pick(e);s.style.left=ri(0,95)+"%";s.style.fontSize=ri(18,34)+"px";s.style.animationDuration=ri(20,40)/10+"s";document.body.appendChild(s);setTimeout(()=>s.remove(),4500)}}
const vis=(a,nm)=>`<div class="py" style="margin:0"><code>${nm}</code> <small>(index shown under each box)</small></div><div class="arr">${a.map((v,i)=>`<div class="cell" style="--h:${(i*47+260)%360}"><b>${v}</b><i>${i}</i></div>`).join("")}</div>`;

/* ---------- questions ---------- */
function idx(){const nm=pick(NM),n=D?ri(6,9):ri(4,6),a=uniq(n,1,D?60:20),t=ri(1,D?7:4),k=ri(0,n-1),B={kind:"calc",op:"Index",arr:a,nm},z="Indexes start at 0, so ";
 if(t===1)return{...B,text:"What value is stored here?",big:nm+"["+k+"]",py:nm+"["+k+"]",ans:a[k],hint:"The first item is index 0, the second is index 1…",why:z+"index "+k+" is item number "+(k+1)+", which is "+a[k]+"."};
 if(t===2)return{...B,text:"Which index holds the value "+a[k]+"?",ans:k,hint:"Count along the boxes starting at 0.",why:a[k]+" is at index "+k+". 🐍 "+nm+".index("+a[k]+") gives "+k+"."};
 if(t===3)return{...B,text:"What is the index of the last item?",big:"LEN("+nm+") - 1",py:"len("+nm+") - 1",ans:n-1,hint:"There are "+n+" items, but indexes start at 0.",why:"len("+nm+") = "+n+", so the last index is "+n+" − 1 = "+(n-1)+"."};
 if(t===4)return{...B,text:"Which index is item number "+(k+1)+" (counting from 1)?",ans:k,hint:"Subtract 1: the first item has index 0.",why:"Item number "+(k+1)+" is at index "+k+"."};
 if(t===5){let j;do{j=ri(0,n-1)}while(j===k);const e=nm+"["+k+"] + "+nm+"["+j+"]";return{...B,text:"Work out:",big:e,py:e,ans:a[k]+a[j],hint:"Find each value first, then add.",why:nm+"["+k+"] = "+a[k]+" and "+nm+"["+j+"] = "+a[j]+", total "+(a[k]+a[j])+"."}}
 if(t===6){const m=ri(1,3);return{...B,text:"In Python, negative indexes count from the end. What is this?",big:nm+"[-"+m+"]",py:nm+"[-"+m+"]",ans:a[n-m],hint:"[-1] is the last item, [-2] is the one before it…",why:nm+"[-"+m+"] is the same as "+nm+"["+(n-m)+"], which is "+a[n-m]+"."}}
 const s=ri(0,2),e=ri(s+2,n);return{...B,text:"A slice starts at the first index and stops before the second. How many items are in it?",big:nm+"["+s+":"+e+"]",py:nm+"["+s+":"+e+"]",ans:e-s,hint:"Count from index "+s+" up to, but not including, index "+e+".",why:"Indexes "+s+" to "+(e-1)+" give "+e+" − "+s+" = "+(e-s)+" items."}}
function upd(){const n=D?ri(5,7):ri(4,5),a=uniq(n,1,D?40:15),t=D?pick([1,2,3,4,4]):ri(1,3),k=ri(1,n-1);let c,ans,why,hint="Trace each line and keep track of the array.",pyonly=false;
 if(t===1){const v=ri(1,D?50:20),i=ri(0,n-1),j=(i+1)%n;c=dec("a",a)+"\na["+i+"] ← "+v+"\nOUTPUT a["+i+"] + a["+j+"]";ans=v+a[j];why="After the change a["+i+"] is "+v+", and a["+j+"] is "+a[j]+". Total "+ans+"."}
 else if(t===2){c=dec("a",a)+"\ntemp ← a[0]\na[0] ← a["+k+"]\na["+k+"] ← temp\nOUTPUT a["+k+"]";ans=a[0];hint="This swaps two items. temp remembers the old a[0].";why="a[0] and a["+k+"] are swapped, so a["+k+"] now holds the old a[0]: "+ans+"."}
 else if(t===3){const i=ri(0,n-2);c=dec("a",a)+"\na["+i+"] ← a["+i+"] + a["+(i+1)+"]\nOUTPUT a["+i+"]";ans=a[i]+a[i+1];why="a["+i+"] becomes "+a[i]+" + "+a[i+1]+" = "+ans+"."}
 else{const cur=a.slice(0,4),L=["nums = ["+cur.join(", ")+"]"];
  for(let s=0;s<3;s++){const r=cur.length>2?ri(1,5):1,x=ri(1,40);
   if(r===1){cur.push(x);L.push("nums.append("+x+")")}
   else if(r===2){cur.pop();L.push("nums.pop()")}
   else if(r===3){cur.shift();L.push("nums.pop(0)")}
   else if(r===4){cur.splice(1,0,x);L.push("nums.insert(1, "+x+")")}
   else{const v=cur[ri(0,cur.length-1)];cur.splice(cur.indexOf(v),1);L.push("nums.remove("+v+")")}}
  const o=pick([["len(nums)",cur.length],["nums[0]",cur[0]],["nums[-1]",cur[cur.length-1]]]);
  L.push("print("+o[0]+")");c=L.join("\n");ans=o[1];pyonly=true;
  hint="Update the list after every line. append adds to the end, pop() removes the last item, pop(0) removes the first, insert(1, x) puts x at index 1, remove(v) deletes the first v.";why="The final list is ["+cur.join(", ")+"], so "+o[0]+" = "+ans+"."}
 return{kind:"code",op:"Update",text:pyonly?"Python lists can grow and shrink. What does this print?":"What does this program output?",code:c,pyc:pyonly?null:toPy(c),pyonly,ans,hint,why}}
function loop(){const n=D?ri(6,9):ri(4,6),a=uniq(n,1,D?50:20),t=D?pick([2,3,4,5,6,7,7]):ri(1,4),d=dec("a",a),F="FOR i ← 0 TO LEN(a) - 1\n";let c,ans,why,hint;
 if(t===1){c=d+"\ntotal ← 0\n"+F+"  total ← total + a[i]\nENDFOR\nOUTPUT total";ans=a.reduce((x,y)=>x+y);hint="total starts at 0 and every item is added to it.";why=a.join(" + ")+" = "+ans+". 🐍 sum(a) does the same job."}
 else if(t===2){const x=pick(a);c=d+"\ncount ← 0\n"+F+"  IF a[i] > "+x+" THEN\n    count ← count + 1\n  ENDIF\nENDFOR\nOUTPUT count";ans=a.filter(v=>v>x).length;hint="Count the items that are bigger than "+x+".";why="Items bigger than "+x+": "+(a.filter(v=>v>x).join(", ")||"none")+". That is "+ans+"."}
 else if(t===3){c=d+"\nhighest ← a[0]\n"+F+"  IF a[i] > highest THEN\n    highest ← a[i]\n  ENDIF\nENDFOR\nOUTPUT highest";ans=Math.max(...a);hint="highest keeps the biggest value seen so far.";why="The loop finds the largest item: "+ans+". 🐍 max(a)"}
 else if(t===4){c=d+"\ncount ← 0\n"+F+"  IF a[i] MOD 2 = 0 THEN\n    count ← count + 1\n  ENDIF\nENDFOR\nOUTPUT count";ans=a.filter(v=>v%2===0).length;hint="MOD 2 = 0 means the number is even.";why="Even items: "+(a.filter(v=>v%2===0).join(", ")||"none")+". That is "+ans+"."}
 else if(t===5){c=d+"\npos ← 0\n"+F+"  IF a[i] > a[pos] THEN\n    pos ← i\n  ENDIF\nENDFOR\nOUTPUT pos";ans=a.indexOf(Math.max(...a));hint="pos remembers the index of the biggest item so far, not its value.";why="The biggest item is "+Math.max(...a)+", at index "+ans+"."}
 else if(t===6){const k=ri(0,n-1);c=d+"\n"+F+"  a[i] ← a[i] * 2\nENDFOR\nOUTPUT a["+k+"]";ans=a[k]*2;hint="Every item is doubled before the output.";why="a["+k+"] was "+a[k]+", doubled it is "+ans+"."}
 else{const x=pick(a);c=d+"\nfound ← -1\n"+F+"  IF a[i] = "+x+" THEN\n    found ← i\n  ENDIF\nENDFOR\nOUTPUT found";ans=a.indexOf(x);hint="found stores the index where the value was seen, or -1 if never.";why=x+" is at index "+ans+"."}
 return{kind:"code",op:"Loop",text:"What does this program output?",code:c,pyc:toPy(c),ans,hint,why}}
function grid(){const r=D?3:2,v=uniq(r*3,1,D?50:20),g=[];for(let i=0;i<r;i++)g.push(v.slice(i*3,i*3+3));
 const i=ri(0,r-1),j=ri(0,2),i2=ri(0,r-1),j2=ri(0,2),two=D&&(i!==i2||j!==j2);
 const c="grid ← ["+g.map(x=>"["+x.join(", ")+"]").join(", ")+"]\nOUTPUT grid["+i+"]["+j+"]"+(two?" + grid["+i2+"]["+j2+"]":""),ans=g[i][j]+(two?g[i2][j2]:0);
 return{kind:"code",op:"Index",text:"This is a 2D array (a list of lists). What does it output?",code:c,pyc:toPy(c),ans,hint:"grid[row][column]. Both the row and the column start at 0.",why:"grid["+i+"] is row "+i+", then ["+j+"] picks column "+j+": "+g[i][j]+(two?", and grid["+i2+"]["+j2+"] = "+g[i2][j2]+", total "+ans:"")+"."}}
function algo(){const t=ri(1,5),n=D?ri(6,9):ri(4,6),a=uniq(n,1,D?60:20),nm=pick(NM),B={kind:"real",op:"Algorithm",arr:a,nm};
 if(t===1){const st=[],L=[],m=D?ri(7,10):ri(4,6);
  for(let s=0;s<m;s++){if(st.length&&Math.random()<.35){L.push("POP");st.pop()}else{const x=ri(1,D?50:20);L.push("PUSH "+x);st.push(x)}}
  if(!st.length){st.push(5);L.push("PUSH 5")}
  const top=!D||Math.random()<.5;
  return{kind:"real",op:"Algorithm",text:"A stack starts empty. "+L.join(", ")+". "+(top?"What value is on top now?":"How many items are on the stack now?"),ans:top?st[st.length-1]:st.length,hint:"PUSH adds to the top. POP removes the top item (last in, first out).",why:"The stack is now ["+st.join(", ")+"] (bottom to top). 🐍 PUSH is stack.append(x), POP is stack.pop(), and the top is stack[-1]."}}
 if(t===2){const k=ri(0,n-1),has=!D||Math.random()<.7,x=has?a[k]:61;
  return{...B,text:"A linear search looks for "+x+", starting at index 0. How many items does it compare before it finishes?",ans:has?k+1:n,hint:has?"It stops as soon as it finds the value.":"If the value isn’t there, every item gets checked.",why:has?x+" is at index "+k+", so "+(k+1)+" comparisons.":x+" isn’t in the array, so all "+n+" items are compared."}}
 if(t===3){const m=D?ri(10,40):ri(5,15),b=[];for(let i=0;i<fl(n/2);i++){const d=ri(1,D?9:4);b.push(m+d,m-d)}if(n%2)b.push(m);b.sort(()=>Math.random()-.5);const s=b.reduce((x,y)=>x+y);
  return{...B,arr:b,text:"What is the mean (average) of these values?",ans:m,hint:"Add them all up, then divide by how many there are.",why:"Total "+s+" ÷ "+n+" = "+m+". 🐍 sum("+nm+") / len("+nm+")"}}
 if(t===4){const b=a.slice(0,Math.min(n,7)),c=b.slice();for(let i=0;i<c.length-1;i++)if(c[i]>c[i+1]){const x=c[i];c[i]=c[i+1];c[i+1]=x}
  const k=ri(0,b.length-1);
  return{...B,kind:"code",arr:b,text:"One pass of bubble sort swaps neighbours when the left one is bigger. After one pass, what is at index "+k+"?",ans:c[k],hint:"Compare index 0 and 1, then 1 and 2, and so on, swapping as you go. The biggest value bubbles to the end.",why:"After one pass: ["+c.join(", ")+"]. 🐍 if a[i] > a[i+1]: a[i], a[i+1] = a[i+1], a[i]"}}
 const z=ri(8,15),u=ri(2,z-2),f=Math.random()<.5;
 return{kind:"real",op:"Index",text:"An array has "+z+" spaces (indexes 0 to "+(z-1)+"). The first "+u+" spaces are filled. "+(f?"What is the index of the next free space?":"How many free spaces are left?"),ans:f?u:z-u,hint:f?"Indexes 0 to "+(u-1)+" are used. What comes next?":"Total spaces minus used spaces.",why:f?u+" items fill indexes 0 to "+(u-1)+", so the next free index is "+u+".":z+" − "+u+" = "+(z-u)+" free spaces."}}
const MODES={
 idx:{n:"Indexing 🔢",d:"Reading items by index",h:265,g:idx},
 upd:{n:"Updating ✏️",d:"Change, swap, append",h:330,g:upd},
 loop:{n:"Loops 🔁",d:"Totals, counts, highest",h:190,g:loop},
 algo:{n:"Algorithms 🧠",d:"Stacks, searching, sorting",h:35,g:algo},
 code:{n:"Code tracing 💻",d:"Pseudocode and Python",h:150,g:()=>pick([upd,loop,grid])()},
 boss:{n:"Challenge 🏆",d:"Everything mixed",h:15,g:()=>pick([idx,upd,loop,algo,grid])()}};
const TOP={Index:"Indexing",Update:"Updating",Loop:"Loops and totals",Algorithm:"Stacks, searching, sorting"};

/* ---------- screens ---------- */
function menu(){clearInterval(T);S={};
 $("#app").innerHTML=`<h1>🧩 Hersey’s GCSE Arrays &amp; Lists Dash</h1>
 <p class="sub">GCSE Computer Science · Arrays (Python lists) · 10 questions · beat the clock!</p>
 <div class="row" style="margin-bottom:14px"><button class="dif ${D?"":"on"}" data-d="0">🌱 Easy</button><button class="dif ${D?"on":""}" data-d="1">🔥 Hard</button></div>
 <div class="card"><h2>Quick reminder</h2>
 <table><tr><th></th><th>Exam reference language</th><th>Python 🐍</th></tr>
 <tr><td>Make</td><td><code>a ← [5, 8, 2]</code></td><td><code>a = [5, 8, 2]</code></td></tr>
 <tr><td>Read</td><td><code>a[0] → 5</code></td><td><code>a[0] → 5</code></td></tr>
 <tr><td>Length</td><td><code>LEN(a) → 3</code></td><td><code>len(a) → 3</code></td></tr>
 <tr><td>Change</td><td><code>a[1] ← 9</code></td><td><code>a[1] = 9</code></td></tr>
 <tr><td>Add</td><td>–</td><td><code>a.append(4)</code></td></tr></table>
 <p class="hint" style="margin-bottom:0">Indexes start at 0, so the last item is at index <code>len(a) - 1</code>.</p></div>
 <div class="grid">${Object.keys(MODES).map(k=>{const m=MODES[k],b=store.g("har-"+D+"-"+k);return`<button class="mode" style="--h:${m.h}" data-m="${k}"><b>${m.n}</b><small>${m.d}</small><div class="best">${b?"🏅 Best: "+b:"No score yet"}</div></button>`}).join("")}</div>`;
 document.querySelectorAll(".mode").forEach(b=>b.onclick=()=>start(b.dataset.m));
 document.querySelectorAll(".dif").forEach(b=>b.onclick=()=>{D=+b.dataset.d;store.s("har-d",D);menu()})}
function start(m){S={m,i:0,score:0,streak:0,best:0,right:0,st:{Index:[0,0],Update:[0,0],Loop:[0,0],Algorithm:[0,0]}};next()}
function next(){clearInterval(T);if(S.i>=TOTAL)return end();
 const q=S.q=MODES[S.m].g();S.done=false;S.hint=false;S.i++;
 q.t={calc:[25,15],real:[40,30],code:[75,55]}[q.kind][D];
 const hl=s=>esc(s).replace(/\b(OUTPUT|IF|THEN|ENDIF|FOR|TO|ENDFOR|LEN|DIV|MOD)\b/g,'<b style="color:var(--kw)">$1</b>');
 const codeBlock=!q.code?"":q.pyonly?`<div class="py" style="margin-bottom:6px">🐍 Python only</div><pre>${esc(q.code)}</pre>`:`<div class="row"><button class="tab on" data-t="1">🐍 Python</button><button class="tab" data-t="0">Exam reference language</button></div><pre id="p0" hidden>${hl(q.code)}</pre><pre id="p1">${esc(q.pyc)}</pre>`;
 $("#app").innerHTML=`<div class="bar"><span>Question ${S.i}/${TOTAL} · ${D?"Hard 🔥":"Easy 🌱"}</span><span>⭐ ${S.score} &nbsp; 🔥 ${S.streak}</span></div>
 <div class="prog"><i style="width:${(S.i-1)/TOTAL*100}%"></i></div>
 <div class="card"><div class="tm"><i id="tb"></i></div><div class="bar" style="margin:-6px 0 6px"><span></span><span id="tn">${q.t}s</span></div>
 <p class="q">${q.text}</p>
 ${q.arr?vis(q.arr,q.nm):""}
 ${q.big?`<div class="big">${q.py}</div>${q.big!==q.py?`<div class="py">Exam reference language: <code>${q.big}</code></div>`:""}`:""}
 ${codeBlock}
 <div class="row"><input id="ans" type="number" inputmode="numeric" placeholder="Your answer" autocomplete="off"><button class="pri" id="chk">Check</button></div>
 <div id="fb"></div>
 <div class="row" style="margin-top:10px"><button class="ghost" id="hb" style="flex:1">💡 Hint (half points)</button><button class="ghost" id="qb">Quit</button></div><div id="hint"></div></div>`;
 document.querySelectorAll(".tab").forEach(b=>b.onclick=()=>{document.querySelectorAll(".tab").forEach(x=>x.classList.toggle("on",x===b));$("#p0").hidden=b.dataset.t==="1";$("#p1").hidden=b.dataset.t==="0"});
 $("#chk").onclick=()=>{const v=$("#ans").value.trim();if(v!=="")finish(Number(v)===q.ans)};
 $("#ans").onkeydown=e=>{if(e.key==="Enter")$("#chk").click()};
 $("#hb").onclick=()=>{S.hint=true;$("#hint").innerHTML='<div class="hint">💡 '+q.hint+'</div>'};
 $("#qb").onclick=menu;$("#ans").focus();
 S.t0=Date.now();S.rem=q.t;
 T=setInterval(()=>{const e=Math.max(0,q.t-(Date.now()-S.t0)/1000),f=e/q.t;S.rem=e;$("#tb").style.width=f*100+"%";$("#tb").style.background="hsl("+Math.round(f*120)+" 80% 48%)";$("#tn").textContent=Math.ceil(e)+"s";if(e<=0)finish(false,true)},100)}
function finish(ok,to){if(S.done)return;S.done=true;clearInterval(T);
 const q=S.q,t=S.st[q.op];t[1]++;let m;
 if(ok){t[0]++;S.right++;S.streak++;S.best=Math.max(S.best,S.streak);
  const base=(D?20:10)/(S.hint?2:1),sb=S.hint?0:Math.min(S.streak-1,5),tb=S.hint?0:Math.round(5*S.rem/q.t),pts=base+sb+tb;S.score+=pts;
  m='<div class="fb ok pop"><b>✅ Correct! +'+pts+'</b><br><small>'+base+' base'+(sb?' + '+sb+' streak':'')+(tb?' + '+tb+' speed':'')+'</small><p>'+q.why+'</p></div>';
  if(S.streak%5===0)confetti(14)}
 else{S.streak=0;m='<div class="fb no shake"><b>'+(to?"⏰ Time’s up! ":"❌ Not quite. ")+'The answer is '+q.ans+'.</b><p>'+q.why+'</p></div>'}
 $("#fb").innerHTML=m+'<button class="pri" id="nx" style="width:100%;margin-top:12px">'+(S.i>=TOTAL?"See results":"Next question")+'</button>';
 $("#ans").disabled=true;$("#chk").disabled=true;$("#hb").disabled=true;
 $("#nx").onclick=next;$("#nx").focus()}
function end(){const pct=S.right*10,key="har-"+D+"-"+S.m,old=store.g(key),nh=S.score>old;if(nh)store.s(key,S.score);
 if(nh||pct===100)confetti(40);
 const msg=pct===100?"Perfect! Exam ready. 🏆":pct>=80?"Great work, nearly there! 🎉":pct>=50?"Good progress. Keep practising! 💪":"Keep going. Use the hints and read the working! 🌱";
 const rows=Object.entries(S.st).filter(([k,v])=>v[1]>0).map(([k,v])=>`<div class="stat"><span>${TOP[k]}</span><b>${v[0]}/${v[1]}</b></div>`).join("");
 $("#app").innerHTML=`<h1>Round complete!</h1><p class="sub">${MODES[S.m].n} · ${D?"Hard 🔥":"Easy 🌱"}</p>
 <div class="card"><p class="score">${S.score}</p><p style="text-align:center;margin:0 0 6px">points</p>
 <p style="text-align:center;font-weight:700;margin:0 0 12px">${nh?"🏆 New high score!":"🏅 High score: "+old}</p>
 <div class="stat"><span>Correct</span><b>${S.right}/${TOTAL} (${pct}%)</b></div><div class="stat"><span>Best streak</span><b>🔥 ${S.best}</b></div>${rows}
 <p style="margin-bottom:0">${msg}</p></div>
 <div class="row"><button class="pri" id="again" style="flex:1">Play again</button><button id="mn" style="flex:1;text-align:center">Menu</button></div>`;
 $("#again").onclick=()=>start(S.m);$("#mn").onclick=menu}
menu();
</script>
</body>
</html>
