<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Hersey’s GCSE DIV &amp; MOD Dash</title>
<style>
:root{--bg:#fff7ed;--card:#fff;--ink:#231942;--muted:#6b6485;--accent:#7c3aed;--accent2:#ec4899;--accent-ink:#fff;--good:#15803d;--goodbg:#dcfce7;--bad:#b91c1c;--badbg:#fee2e2;--line:#eadff5;--code:#1e1e2e;--code-ink:#cdd6f4;--kw:#f9a8d4;--s1:95%;--l1:92%;--l2:60%;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#150f28;--card:#211a3a;--ink:#f3eeff;--muted:#b3a9d1;--accent:#a78bfa;--accent2:#f472b6;--accent-ink:#150f28;--good:#86efac;--goodbg:#14301f;--bad:#fca5a5;--badbg:#3a1717;--line:#352b58;--code:#0b0814;--s1:45%;--l1:24%;--l2:62%;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#150f28;--card:#211a3a;--ink:#f3eeff;--muted:#b3a9d1;--accent:#a78bfa;--accent2:#f472b6;--accent-ink:#150f28;--good:#86efac;--goodbg:#14301f;--bad:#fca5a5;--badbg:#3a1717;--line:#352b58;--code:#0b0814;--s1:45%;--l1:24%;--l2:62%;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:10}
main{max-width:560px;margin:0 auto;padding:16px 16px 40px}
h1{font-size:1.75rem;line-height:1.15;margin:0 0 4px;background:linear-gradient(90deg,#7c3aed,#ec4899,#f59e0b,#10b981);background-size:200% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:sh 5s ease-in-out infinite alternate}
@keyframes sh{to{background-position:100% 0}}
.sub{color:var(--muted);margin:0 0 14px}
.card{background:var(--card);border:2px solid var(--line);border-radius:18px;padding:16px;margin-bottom:14px}
.card h2{font-size:1rem;margin:0 0 8px}
table{width:100%;border-collapse:collapse;font-size:.9rem}
th,td{padding:6px;text-align:left;border-bottom:1px solid var(--line)}
th{color:var(--muted);font-weight:600}
code{font-family:ui-monospace,Menlo,Consolas,monospace}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
button{font:inherit;cursor:pointer;border-radius:14px;border:2px solid var(--line);background:var(--card);color:var(--ink);padding:12px;text-align:left}
button small{display:block;color:var(--muted);font-size:.8rem}
button:active{transform:scale(.97)}
button:disabled{opacity:.5}
.mode{background:hsl(var(--h) var(--s1) var(--l1));border-color:hsl(var(--h) 70% var(--l2))}
.mode b{font-size:1.02rem}
.mode .best{color:var(--ink);font-weight:600;margin-top:2px}
.pri{background:linear-gradient(90deg,var(--accent),var(--accent2));color:#fff;border:0;font-weight:700;text-align:center}
.ghost{text-align:center;color:var(--muted)}
.dif{flex:1;text-align:center;font-weight:700}
.dif.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.row{display:flex;gap:10px}
.bar{display:flex;justify-content:space-between;font-size:.9rem;color:var(--muted);margin-bottom:8px}
.prog,.tm{height:8px;background:var(--line);border-radius:99px;overflow:hidden;margin-bottom:12px}
.prog i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--accent2));transition:width .3s}
.tm{height:12px}
.tm i{display:block;height:100%;width:100%;background:hsl(120 80% 48%)}
.q{font-size:1.15rem;font-weight:600;margin:0 0 12px}
.big{font-size:2.3rem;text-align:center;padding:6px 0;font-weight:800;font-family:ui-monospace,Menlo,Consolas,monospace;color:var(--accent)}
.py{text-align:center;color:var(--muted);margin-bottom:12px}
pre{background:var(--code);color:var(--code-ink);padding:12px;border-radius:12px;overflow-x:auto;margin:0 0 12px;font-size:.95rem}
pre[hidden]{display:none}
.tab{flex:1;text-align:center;padding:6px;margin-bottom:8px;font-size:.9rem}
.tab.on{background:var(--accent2);color:#fff;border-color:var(--accent2)}
input{flex:1;min-width:0;font:inherit;font-size:1.3rem;padding:10px 12px;border-radius:12px;border:2px solid var(--line);background:var(--bg);color:var(--ink)}
input:focus{outline:none;border-color:var(--accent)}
.fb{border-radius:12px;padding:12px;margin-top:12px}
.fb.ok{background:var(--goodbg);color:var(--good)}
.fb.no{background:var(--badbg);color:var(--bad)}
.fb p{margin:4px 0 0;color:var(--ink);font-size:.94rem}
.hint{margin-top:10px;font-size:.92rem;color:var(--muted)}
.stat{display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid var(--line)}
.score{font-size:3.2rem;font-weight:800;text-align:center;margin:0;color:var(--accent2)}
.pop{animation:pop .4s}@keyframes pop{50%{transform:scale(1.05)}}
.shake{animation:shk .4s}@keyframes shk{25%{transform:translateX(-7px)}75%{transform:translateX(7px)}}
.cf{position:fixed;top:-40px;z-index:20;pointer-events:none;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(115vh) rotate(360deg)}}
</style>
</head>
<body>
<main id="app"></main>
<script>
const $=s=>document.querySelector(s),ri=(a,b)=>Math.floor(Math.random()*(b-a+1))+a,pick=a=>a[ri(0,a.length-1)],fl=Math.floor,TOTAL=10;
const store={g(k){try{return+localStorage.getItem(k)||0}catch(e){return 0}},s(k,v){try{localStorage.setItem(k,v)}catch(e){}}};
let S={},D=store.g("hdm-d"),T=null;
const py=s=>s.replace(/\bDIV\b/g,"//").replace(/\bMOD\b/g,"%");
const P=(a,b)=>a+" // "+b+" = "+fl(a/b)+", "+a+" % "+b+" = "+a%b;
const esc=s=>s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
const toPy=c=>c.split("\n").map(l=>{let m;
 if(/^\s*END/.test(l))return null;
 if(m=l.match(/^(\s*)FOR (\w+) ← (\d+) TO (\d+)/))return m[1]+"for "+m[2]+" in range("+m[3]+", "+(+m[4]+1)+"):";
 if(m=l.match(/^(\s*)IF (.*) THEN/))return m[1]+"if "+py(m[2]).replace(" = "," == ")+":";
 if(m=l.match(/^(\s*)WHILE (.*)/))return m[1]+"while "+py(m[2])+":";
 if(m=l.match(/^(\s*)OUTPUT (.*)/))return m[1]+"print("+py(m[2])+")";
 return py(l.replace("←","="))}).filter(x=>x!==null).join("\n");
function confetti(n){const e=["🎉","✨","🌟","🎈","🧡","💜"];for(let i=0;i<n;i++){const s=document.createElement("span");s.className="cf";s.textContent=pick(e);s.style.left=ri(0,95)+"%";s.style.fontSize=ri(18,34)+"px";s.style.animationDuration=ri(20,40)/10+"s";document.body.appendChild(s);setTimeout(()=>s.remove(),4500)}}

/* ---------- questions ---------- */
function basic(op){const h=D;let b=h?ri(6,25):ri(2,9),q=h?ri(5,40):ri(2,12),r=ri(0,b-1);
 if(h&&Math.random()<.2){q=0;r=ri(1,b-1)}
 const a=b*q+r;
 return{kind:"calc",op,text:"Work out:",big:a+" "+op+" "+b,py:a+(op==="DIV"?" // ":" % ")+b,ans:op==="DIV"?q:r,
 hint:"How many whole times does "+b+" fit into "+a+"? That’s DIV. What’s left over is MOD.",
 why:a+" ÷ "+b+" = "+q+" remainder "+r+" ("+b+" × "+q+" = "+b*q+", "+a+" − "+b*q+" = "+r+"). 🐍 "+P(a,b)}}
function real(){const h=D,t=ri(1,8),d=Math.random()<.5,op=d?"DIV":"MOD";
 if(t===1){const m=h?ri(500,3999):ri(70,499);
  return{kind:"real",op,text:"A film lasts "+m+" minutes. Write this as hours and minutes. "+(d?"How many whole hours?":"How many minutes are left over?"),ans:d?fl(m/60):m%60,hint:"There are 60 minutes in an hour. "+(d?"Use DIV 60.":"Use MOD 60."),why:m+" DIV 60 = "+fl(m/60)+" hours, "+m+" MOD 60 = "+m%60+" minutes. 🐍 "+P(m,60)}}
 if(t===2){const k=h?ri(7,19):ri(3,9),n=k*(h?ri(8,30):ri(3,9))+ri(1,k-1);
  return{kind:"real",op,text:n+" sweets are shared equally between "+k+" friends. "+(d?"How many does each friend get?":"How many sweets are left over?"),ans:d?fl(n/k):n%k,hint:"Whole sweets each = DIV. Left over = MOD.",why:n+" DIV "+k+" = "+fl(n/k)+" each, "+n+" MOD "+k+" = "+n%k+" left over. 🐍 "+P(n,k)}}
 if(t===3){const s=pick(h?[8,12,24,36]:[6,10,12]),n=s*(h?ri(5,30):ri(2,9))+ri(1,s-1);
  return{kind:"real",op,text:"A shop packs "+n+" eggs into boxes of "+s+". "+(d?"How many full boxes can it make?":"How many eggs are left over?"),ans:d?fl(n/s):n%s,hint:"Full boxes = DIV "+s+". Left over = MOD "+s+".",why:n+" DIV "+s+" = "+fl(n/s)+" boxes, "+n+" MOD "+s+" = "+n%s+" left. 🐍 "+P(n,s)}}
 if(t===4){const hr=ri(1,23),add=h?ri(100,400):ri(25,100),a=(hr+add)%24;
  return{kind:"real",op:"MOD",text:"It is "+hr+":00 on a 24-hour clock. What hour will it be "+add+" hours later?",ans:a,hint:"Add the hours, then use MOD 24 so the clock wraps around.",why:hr+" + "+add+" = "+(hr+add)+", and "+(hr+add)+" MOD 24 = "+a+". 🐍 ("+hr+" + "+add+") % 24"}}
 if(t===5){const k=pick(h?[24,36,48,52,54]:[4,6,8,15,20,30]),n=k*ri(2,6)+ri(1,k-1);
  return{kind:"real",op:"Both",text:n+" students go on a trip. Each minibus holds "+k+". How many minibuses are needed?",ans:fl(n/k)+1,hint:"Full buses = DIV. If anyone is left over (MOD isn’t 0) you need one more bus.",why:n+" DIV "+k+" = "+fl(n/k)+" full buses, "+n+" MOD "+k+" = "+n%k+" left over, so 1 more bus: "+(fl(n/k)+1)+". 🐍 "+P(n,k)}}
 if(t===6){const z=pick(h?[11,13,17,19]:[5,7,10]),k=h?ri(100,999):ri(20,99);
  return{kind:"real",op:"MOD",text:"A hash table has "+z+" slots (0 to "+(z-1)+"). The hash function is key MOD "+z+". Which slot stores the key "+k+"?",ans:k%z,hint:"The slot number is the remainder when the key is divided by "+z+".",why:k+" MOD "+z+" = "+k%z+". 🐍 "+k+" % "+z}}
 if(t===7){const z=h?ri(6,12):ri(4,8),r=ri(0,z-1),n=h?ri(z+1,3*z):ri(2,z-1),a=(r+n)%z;
  return{kind:"real",op:"MOD",text:"A circular queue has "+z+" spaces (indexes 0 to "+(z-1)+"). The rear pointer is at index "+r+". "+n+" items are added one at a time. Which index is the rear pointer at now?",ans:a,hint:"The pointer wraps back to 0 at the end. Use (rear + items) MOD size.",why:"("+r+" + "+n+") MOD "+z+" = "+(r+n)+" MOD "+z+" = "+a+". 🐍 ("+r+" + "+n+") % "+z}}
 const n=h?ri(60,250):ri(12,63),k=h?ri(2,4):ri(1,2);let x=n;const rs=[];while(x>0){rs.push(x%2);x=fl(x/2)}
 return{kind:"real",op:"MOD",text:"To convert "+n+" to binary, divide by 2 again and again, noting each remainder. What is remainder number "+k+"? (Count from the first division.)",ans:rs[k-1],hint:"Each remainder is x MOD 2. Then x becomes x DIV 2 for the next step.",why:"Remainders in order: "+rs.join(", ")+". Remainder "+k+" = "+rs[k-1]+". 🐍 x % 2, then x // 2"}}
function code(){const h=D,t=h?pick([1,2,3,5,6,6]):ri(1,4);let c,a,why,op="Both",hint="Trace it line by line and write down each variable.";
 if(t===1){const n=h?ri(1000,9999):ri(100,999),v=ri(0,3);
  const e=h?["n MOD 100","n DIV 100","(n DIV 10) MOD 10","n DIV 1000"]:["n MOD 10","n DIV 10","(n DIV 10) MOD 10","n DIV 100"];
  a=h?[n%100,fl(n/100),fl(n/10)%10,fl(n/1000)][v]:[n%10,fl(n/10),fl(n/10)%10,fl(n/100)][v];op=["MOD","DIV","Both","DIV"][v];
  c="n ← "+n+"\nOUTPUT "+e[v];hint="MOD 10 gives the last digit, DIV 10 chops it off. MOD 100 gives the last two digits.";why="With n = "+n+": "+e[v]+" = "+a+"."}
 else if(t===2){const b=h?ri(6,19):ri(3,9),x=b*(h?ri(5,30):ri(2,9))+ri(1,b-1);a=fl(x/b)+x%b;
  c="a ← "+x+"\nb ← "+b+"\nOUTPUT (a DIV b) + (a MOD b)";hint="Work out each bracket separately, then add.";why=x+" DIV "+b+" = "+fl(x/b)+" and "+x+" MOD "+b+" = "+x%b+", total "+a+"."}
 else if(t===3){const N=h?ri(50,120):ri(20,45),k=h?ri(4,9):ri(3,6);a=fl(N/k);
  c="count ← 0\nFOR i ← 1 TO "+N+"\n  IF i MOD "+k+" = 0 THEN\n    count ← count + 1\n  ENDIF\nENDFOR\nOUTPUT count";hint="i MOD "+k+" = 0 means i is a multiple of "+k+". Count them up to "+N+".";why="It counts the multiples of "+k+" up to "+N+": "+N+" DIV "+k+" = "+a+"."}
 else if(t===4){const n=ri(12,98);a=fl(n/10)+n%10;
  c="x ← "+n+"\ny ← x MOD 10\nx ← x DIV 10\nOUTPUT x + y";hint="y is the last digit. Then x loses its last digit.";why="y = "+n%10+", x = "+fl(n/10)+", output "+a+"."}
 else if(t===5){const b=ri(4,9),x=b*ri(3,8)+ri(1,b-1);a=x%b;op="MOD";
  c="total ← "+x+"\nWHILE total >= "+b+"\n  total ← total - "+b+"\nENDWHILE\nOUTPUT total";hint="It keeps subtracting "+b+" until the number is smaller than "+b+".";why="Repeated subtraction leaves the remainder: "+x+" MOD "+b+" = "+a+"."}
 else{let n;do{n=ri(100,999)}while(n%10===0);a=+String(n).split("").reverse().join("");
  c="n ← "+n+"\nrev ← 0\nWHILE n > 0\n  rev ← rev * 10 + n MOD 10\n  n ← n DIV 10\nENDWHILE\nOUTPUT rev";hint="Each loop moves the last digit of n (MOD 10) onto the end of rev, then removes it (DIV 10).";why="The loop reverses the digits, so the output is "+a+"."}
 return{kind:"code",op,text:"What does this program output?",code:c,pyc:toPy(c),ans:a,hint,why}}
const MODES={
 div:{n:"DIV ➗",d:"Whole-number division",h:265,g:()=>basic("DIV")},
 mod:{n:"MOD 🎯",d:"Remainders",h:330,g:()=>basic("MOD")},
 mix:{n:"Mixed 🎲",d:"DIV and MOD together",h:190,g:()=>basic(pick(["DIV","MOD"]))},
 real:{n:"Real life 🛒",d:"Time, sharing, hashing, binary",h:35,g:real},
 code:{n:"Code tracing 💻",d:"Pseudocode and Python",h:150,g:code},
 boss:{n:"Challenge 🏆",d:"Everything mixed",h:15,g:()=>pick([()=>basic(pick(["DIV","MOD"])),real,code])()}};

/* ---------- screens ---------- */
function menu(){clearInterval(T);S={};
 $("#app").innerHTML=`<h1>🚀 Hersey’s GCSE DIV &amp; MOD Dash</h1>
 <p class="sub">GCSE Computer Science · 10 questions · beat the clock!</p>
 <div class="row" style="margin-bottom:14px"><button class="dif ${D?"":"on"}" data-d="0">🌱 Easy</button><button class="dif ${D?"on":""}" data-d="1">🔥 Hard</button></div>
 <div class="card"><h2>Quick reminder</h2>
 <table><tr><th></th><th>GCSE pseudocode</th><th>Python 🐍</th></tr>
 <tr><td><b>DIV</b></td><td><code>17 DIV 5 → 3</code></td><td><code>17 // 5 → 3</code></td></tr>
 <tr><td><b>MOD</b></td><td><code>17 MOD 5 → 2</code></td><td><code>17 % 5 → 2</code></td></tr></table>
 <p class="hint" style="margin-bottom:0">DIV = whole times it fits. MOD = remainder. <code>n MOD 2 = 0</code> means even.</p></div>
 <div class="grid">${Object.keys(MODES).map(k=>{const m=MODES[k],b=store.g("hdm-"+D+"-"+k);return`<button class="mode" style="--h:${m.h}" data-m="${k}"><b>${m.n}</b><small>${m.d}</small><div class="best">${b?"🏅 Best: "+b:"No score yet"}</div></button>`}).join("")}</div>`;
 document.querySelectorAll(".mode").forEach(b=>b.onclick=()=>start(b.dataset.m));
 document.querySelectorAll(".dif").forEach(b=>b.onclick=()=>{D=+b.dataset.d;store.s("hdm-d",D);menu()})}
function start(m){S={m,i:0,score:0,streak:0,best:0,right:0,st:{DIV:[0,0],MOD:[0,0],Both:[0,0]}};next()}
function next(){clearInterval(T);if(S.i>=TOTAL)return end();
 const q=S.q=MODES[S.m].g();S.done=false;S.hint=false;S.i++;
 q.t={calc:[20,12],real:[40,30],code:[60,45]}[q.kind][D];
 const hl=s=>esc(s).replace(/\b(OUTPUT|IF|THEN|ENDIF|FOR|TO|ENDFOR|WHILE|ENDWHILE|DIV|MOD)\b/g,'<b style="color:var(--kw)">$1</b>');
 $("#app").innerHTML=`<div class="bar"><span>Question ${S.i}/${TOTAL} · ${D?"Hard 🔥":"Easy 🌱"}</span><span>⭐ ${S.score} &nbsp; 🔥 ${S.streak}</span></div>
 <div class="prog"><i style="width:${(S.i-1)/TOTAL*100}%"></i></div>
 <div class="card"><div class="tm"><i id="tb"></i></div><div class="bar" style="margin:-6px 0 6px"><span></span><span id="tn">${q.t}s</span></div>
 <p class="q">${q.text}</p>
 ${q.big?`<div class="big">${q.big}</div><div class="py">🐍 Python: <code>${q.py}</code></div>`:""}
 ${q.code?`<div class="row"><button class="tab on" data-t="0">Pseudocode</button><button class="tab" data-t="1">🐍 Python</button></div><pre id="p0">${hl(q.code)}</pre><pre id="p1" hidden>${esc(q.pyc)}</pre>`:""}
 <div class="row"><input id="ans" type="number" inputmode="numeric" placeholder="Your answer" autocomplete="off"><button class="pri" id="chk">Check</button></div>
 <div id="fb"></div>
 <div class="row" style="margin-top:10px"><button class="ghost" id="hb" style="flex:1">💡 Hint (half points)</button><button class="ghost" id="qb">Quit</button></div><div id="hint"></div></div>`;
 document.querySelectorAll(".tab").forEach(b=>b.onclick=()=>{document.querySelectorAll(".tab").forEach(x=>x.classList.toggle("on",x===b));$("#p0").hidden=b.dataset.t==="1";$("#p1").hidden=b.dataset.t==="0"});
 $("#chk").onclick=()=>{const v=$("#ans").value.trim();if(v!=="")finish(Number(v)===q.ans)};
 $("#ans").onkeydown=e=>{if(e.key==="Enter")$("#chk").click()};
 $("#hb").onclick=()=>{S.hint=true;$("#hint").innerHTML='<div class="hint">💡 '+q.hint+'</div>'};
 $("#qb").onclick=menu;$("#ans").focus();
 S.t0=Date.now();S.rem=q.t;
 T=setInterval(()=>{const e=Math.max(0,q.t-(Date.now()-S.t0)/1000),f=e/q.t;S.rem=e;$("#tb").style.width=f*100+"%";$("#tb").style.background="hsl("+Math.round(f*120)+" 80% 48%)";$("#tn").textContent=Math.ceil(e)+"s";if(e<=0)finish(false,true)},100)}
function finish(ok,to){if(S.done)return;S.done=true;clearInterval(T);
 const q=S.q,t=S.st[q.op];t[1]++;let m;
 if(ok){t[0]++;S.right++;S.streak++;S.best=Math.max(S.best,S.streak);
  const base=(D?20:10)/(S.hint?2:1),sb=S.hint?0:Math.min(S.streak-1,5),tb=S.hint?0:Math.round(5*S.rem/q.t),pts=base+sb+tb;S.score+=pts;
  m='<div class="fb ok pop"><b>✅ Correct! +'+pts+'</b><br><small>'+base+' base'+(sb?' + '+sb+' streak':'')+(tb?' + '+tb+' speed':'')+'</small><p>'+q.why+'</p></div>';
  if(S.streak%5===0)confetti(14)}
 else{S.streak=0;m='<div class="fb no shake"><b>'+(to?"⏰ Time’s up! ":"❌ Not quite. ")+'The answer is '+q.ans+'.</b><p>'+q.why+'</p></div>'}
 $("#fb").innerHTML=m+'<button class="pri" id="nx" style="width:100%;margin-top:12px">'+(S.i>=TOTAL?"See results":"Next question")+'</button>';
 $("#ans").disabled=true;$("#chk").disabled=true;$("#hb").disabled=true;
 $("#nx").onclick=next;$("#nx").focus()}
function end(){const pct=S.right*10,key="hdm-"+D+"-"+S.m,old=store.g(key),nh=S.score>old;if(nh)store.s(key,S.score);
 if(nh||pct===100)confetti(40);
 const msg=pct===100?"Perfect! Exam ready. 🏆":pct>=80?"Great work, nearly there! 🎉":pct>=50?"Good progress. Keep practising! 💪":"Keep going. Use the hints and read the working! 🌱";
 const rows=Object.entries(S.st).filter(([k,v])=>v[1]>0).map(([k,v])=>`<div class="stat"><span>${k==="Both"?"Mixed DIV and MOD":k+" questions"}</span><b>${v[0]}/${v[1]}</b></div>`).join("");
 $("#app").innerHTML=`<h1>Round complete!</h1><p class="sub">${MODES[S.m].n} · ${D?"Hard 🔥":"Easy 🌱"}</p>
 <div class="card"><p class="score">${S.score}</p><p style="text-align:center;margin:0 0 6px">points</p>
 <p style="text-align:center;font-weight:700;margin:0 0 12px">${nh?"🏆 New high score!":"🏅 High score: "+old}</p>
 <div class="stat"><span>Correct</span><b>${S.right}/${TOTAL} (${pct}%)</b></div><div class="stat"><span>Best streak</span><b>🔥 ${S.best}</b></div>${rows}
